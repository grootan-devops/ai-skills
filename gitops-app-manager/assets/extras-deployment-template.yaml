# ==============================================================================
# Production-Grade Kubernetes Manifest Stack for Extras Workload
# Exact Replica of helm-tpl-library Architecture Standard
# ==============================================================================
# Workload Identity:
#   Product:   ${PRODUCT_NAME}
#   Component: ${COMPONENT_NAME}
#   Service:   ${SERVICE_NAME}
#   Namespace: ${NAMESPACE}
#   Host:      ${HOSTNAME}
# ==============================================================================

---
# ------------------------------------------------------------------------------
# 1. ServiceAccount
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/managed-by: argocd
automountServiceAccountToken: false

---
# ------------------------------------------------------------------------------
# 2. ConfigMap (Environment Variables)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${SERVICE_NAME}-env
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/managed-by: argocd
data:
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
  METRICS_PORT: "8080"
  METRICS_PATH: "/metrics"

---
# ------------------------------------------------------------------------------
# 3. Secret (Sensitive Environment Variables)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: ${SERVICE_NAME}-env
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/managed-by: argocd
type: Opaque
stringData:
  API_SECRET_KEY: "replace-with-actual-secret"

---
# ------------------------------------------------------------------------------
# 4. Deployment (Strict 10001:10001 Security, Probes, Topology, Mounts)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/version: "${APP_VERSION}"
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ${SERVICE_NAME}
      app.kubernetes.io/instance: ${SERVICE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${SERVICE_NAME}
        app.kubernetes.io/instance: ${SERVICE_NAME}
        app.kubernetes.io/part-of: ${PRODUCT_NAME}
        app.kubernetes.io/component: ${COMPONENT_NAME}
        app.kubernetes.io/managed-by: argocd
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ${SERVICE_NAME}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Always
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ${SERVICE_NAME}
      containers:
        - name: ${SERVICE_NAME}
          image: ${IMAGE_NAME}
          imagePullPolicy: IfNotPresent
          command: []
          args: []
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: ${SERVICE_NAME}-env
            - secretRef:
                name: ${SERVICE_NAME}-env
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: tmp
          emptyDir: {}

---
# ------------------------------------------------------------------------------
# 5. Service (ClusterIP)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
# ------------------------------------------------------------------------------
# 6. Ingress (Nginx / Classical Ingress with TLS)
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/managed-by: argocd
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${HOSTNAME}
      secretName: ${SERVICE_NAME}-tls
  rules:
    - host: ${HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${SERVICE_NAME}
                port:
                  name: http

---
# ------------------------------------------------------------------------------
# 7. HTTPRoute (Kubernetes Gateway API with APISIX / Envoy)
# ------------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/managed-by: argocd
spec:
  parentRefs:
    - name: default-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - "${HOSTNAME}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ${SERVICE_NAME}
          port: 80

---
# ------------------------------------------------------------------------------
# 8. ServiceMonitor (Prometheus Operator)
# ------------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/managed-by: argocd
    release: prometheus
spec:
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - ${NAMESPACE}
  selector:
    matchLabels:
      app.kubernetes.io/name: ${SERVICE_NAME}
      app.kubernetes.io/instance: ${SERVICE_NAME}

---
# ------------------------------------------------------------------------------
# 9. PodMonitor (Alternative Prometheus Operator Pod Scrape)
# ------------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/managed-by: argocd
    release: prometheus
spec:
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - ${NAMESPACE}
  selector:
    matchLabels:
      app.kubernetes.io/name: ${SERVICE_NAME}
      app.kubernetes.io/instance: ${SERVICE_NAME}

---
# ------------------------------------------------------------------------------
# 10. HorizontalPodAutoscaler (Autoscaling v2)
# ------------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/managed-by: argocd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${SERVICE_NAME}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

---
# ------------------------------------------------------------------------------
# 11. PodDisruptionBudget (PDB)
# ------------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/managed-by: argocd
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${SERVICE_NAME}
      app.kubernetes.io/instance: ${SERVICE_NAME}

---
# ------------------------------------------------------------------------------
# 12. NetworkPolicy (Zero-Trust Ingress & Egress Isolation)
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/instance: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ${PRODUCT_NAME}
    app.kubernetes.io/component: ${COMPONENT_NAME}
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ${SERVICE_NAME}
      app.kubernetes.io/instance: ${SERVICE_NAME}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controllers / gateways
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow internal DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound HTTPS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
