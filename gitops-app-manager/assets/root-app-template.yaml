# ==============================================================================
# ArgoCD Root App-of-Apps Bootstrap Manifest
# ==============================================================================
# IMPORTANT SAFETY CHECK:
#   Before applying this manifest with 'kubectl apply -f <file>', you MUST
#   verify the target Kubernetes context:
#     1. Run: kubectl config current-context
#     2. Confirm you are targeting the intended cluster (dev/qa/prod).
#     3. If no context is set, configure via:
#        kubectl config use-context <context-name>
#        or specify: export KUBECONFIG=/path/to/kubeconfig
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${ROOT_APP_NAME}
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: developer
  source:
    repoURL: ${GITOPS_REPO_URL}
    path: .
    targetRevision: ${GITOPS_BRANCH}
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
