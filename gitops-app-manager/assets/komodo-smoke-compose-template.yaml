# ==============================================================================
# Initial Smoke-Test Compose Definition for Komodo Environment
# Product: ${PRODUCT_NAME}, Environment: ${ENVIRONMENT}
# Stack Name: ${PRODUCT_NAME}-${ENVIRONMENT}
# ==============================================================================
services:
  nginx:
    image: nginx:alpine
    container_name: ${PRODUCT_NAME}-${ENVIRONMENT}-smoke-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
