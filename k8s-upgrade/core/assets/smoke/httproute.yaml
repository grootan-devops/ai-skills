# smoke_test.sh replaces __NS__, __HOST__, __GATEWAY_NS__ and __GATEWAY_NAME__.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smoke
  namespace: __NS__
spec:
  parentRefs:
    - name: __GATEWAY_NAME__
      namespace: __GATEWAY_NS__
  hostnames:
    - __HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: smoke
          port: 80
